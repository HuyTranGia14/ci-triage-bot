<svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="560" fill="#ffffff"/>

  <text x="20" y="30" font-size="18" font-weight="bold" fill="#1f2937">Conceptual Model - CI Failure Triage Bot</text>

  <!-- ================= Repository box ================= -->
  <rect x="40" y="90" width="250" height="210" rx="6" fill="#eaf1fb" stroke="#2f5fa8" stroke-width="1.5"/>
  <rect x="40" y="90" width="250" height="34" rx="6" fill="#2f5fa8"/>
  <rect x="40" y="112" width="250" height="12" fill="#2f5fa8"/>
  <text x="60" y="113" font-size="15" font-weight="bold" fill="#ffffff">Repository</text>
  <rect x="220" y="98" width="60" height="18" rx="9" fill="#1f9d55"/>
  <text x="250" y="111" font-size="10" fill="#ffffff" text-anchor="middle">persisted</text>

  <text x="58" y="146" font-size="12.5" font-family="Consolas, monospace" fill="#111827">PK repository_id</text>
  <text x="58" y="166" font-size="12.5" font-family="Consolas, monospace" fill="#111827">owner</text>
  <text x="58" y="186" font-size="12.5" font-family="Consolas, monospace" fill="#111827">name</text>
  <text x="58" y="206" font-size="12.5" font-family="Consolas, monospace" fill="#111827">webhook_secret_ref</text>
  <text x="58" y="226" font-size="12.5" font-family="Consolas, monospace" fill="#111827">is_active</text>
  <text x="58" y="246" font-size="12.5" font-family="Consolas, monospace" fill="#111827">created_at</text>
  <line x1="52" y1="256" x2="278" y2="256" stroke="#2f5fa8" stroke-width="0.75"/>
  <text x="58" y="276" font-size="11.5" font-style="italic" fill="#3b5bdb">= class RepositoryConfig</text>

  <!-- ================= WebhookPayload box (transient, dashed) ================= -->
  <rect x="400" y="130" width="220" height="140" rx="6" fill="#fdf1ef" stroke="#c65b4e" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="418" y="156" font-size="15" font-weight="bold" fill="#7a2e24">WebhookPayload</text>
  <rect x="546" y="138" width="60" height="18" rx="9" fill="#c65b4e"/>
  <text x="576" y="151" font-size="10" fill="#ffffff" text-anchor="middle">transient</text>

  <text x="418" y="182" font-size="12.5" font-family="Consolas, monospace" fill="#111827">event, status</text>
  <text x="418" y="202" font-size="12.5" font-family="Consolas, monospace" fill="#111827">run_id, repo</text>
  <line x1="412" y1="212" x2="608" y2="212" stroke="#c65b4e" stroke-width="0.75"/>
  <text x="418" y="230" font-size="11.5" font-style="italic" fill="#a8483b">= class WebhookPayload</text>
  <text x="418" y="248" font-size="11.5" font-style="italic" fill="#a8483b">not stored - per-request DTO</text>

  <!-- ================= TriageResult box ================= -->
  <rect x="740" y="60" width="270" height="320" rx="6" fill="#f2ecfb" stroke="#6a3fb0" stroke-width="1.5"/>
  <rect x="740" y="60" width="270" height="34" rx="6" fill="#6a3fb0"/>
  <rect x="740" y="82" width="270" height="12" fill="#6a3fb0"/>
  <text x="760" y="83" font-size="15" font-weight="bold" fill="#ffffff">TriageResult</text>
  <rect x="960" y="68" width="60" height="18" rx="9" fill="#1f9d55"/>
  <text x="990" y="81" font-size="10" fill="#ffffff" text-anchor="middle">persisted</text>

  <text x="758" y="116" font-size="12.5" font-family="Consolas, monospace" fill="#111827">PK triage_result_id</text>
  <text x="758" y="136" font-size="12.5" font-family="Consolas, monospace" fill="#111827">FK repository_id</text>
  <text x="758" y="156" font-size="12.5" font-family="Consolas, monospace" fill="#111827">run_id, pr_number</text>
  <text x="758" y="176" font-size="12.5" font-family="Consolas, monospace" font-weight="bold" fill="#111827">failure_category</text>
  <text x="758" y="196" font-size="12.5" font-family="Consolas, monospace" font-weight="bold" fill="#111827">confidence_score</text>
  <text x="758" y="216" font-size="12.5" font-family="Consolas, monospace" fill="#111827">root_cause</text>
  <text x="758" y="236" font-size="12.5" font-family="Consolas, monospace" fill="#111827">suggested_fix</text>
  <text x="758" y="256" font-size="12.5" font-family="Consolas, monospace" fill="#111827">comment_status</text>
  <text x="758" y="276" font-size="12.5" font-family="Consolas, monospace" fill="#111827">github_comment_url</text>
  <text x="758" y="296" font-size="12.5" font-family="Consolas, monospace" fill="#111827">created_at</text>
  <line x1="752" y1="306" x2="1000" y2="306" stroke="#6a3fb0" stroke-width="0.75"/>
  <text x="758" y="324" font-size="11" font-style="italic" fill="#6a3fb0">fields in bold = added</text>
  <text x="758" y="340" font-size="11" font-style="italic" fill="#6a3fb0">beyond the class diagram</text>
  <text x="758" y="360" font-size="11" fill="#6a3fb0">field names match PromptBuilder /</text>
  <text x="758" y="374" font-size="11" fill="#6a3fb0">ResponseValidator (3.3.7, 3.3.9)</text>

  <!-- ================= Relationships ================= -->
  <!-- Repository -> WebhookPayload : triggers -->
  <line x1="290" y1="190" x2="398" y2="195" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="182" font-size="12" fill="#374151">1</text>
  <text x="382" y="188" font-size="12" fill="#374151">N</text>
  <text x="300" y="212" font-size="12" font-style="italic" fill="#374151">triggers</text>

  <!-- WebhookPayload -> TriageResult : yields -->
  <line x1="620" y1="195" x2="738" y2="195" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="628" y="188" font-size="12" fill="#374151">1</text>
  <text x="712" y="188" font-size="12" fill="#374151">0..1</text>
  <text x="640" y="212" font-size="12" font-style="italic" fill="#374151">yields</text>

  <!-- Repository -> TriageResult : direct FK, curved -->
  <path d="M 165 300 C 165 470, 875 470, 875 382" fill="none" stroke="#6b7280" stroke-width="1.25" stroke-dasharray="2,3" marker-end="url(#arrow2)"/>
  <text x="420" y="465" font-size="12" fill="#4b5563" text-anchor="middle">Repository 1 -- N TriageResult (via repository_id)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="20" y="540" font-size="11" fill="#6b7280">Legend: solid box = persisted entity, dashed box = transient (not stored). Bold fields renamed to match the schema used across 3.3.7 / 3.3.9 / 5.2.5.</text>
</svg>
