<svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="560" fill="#ffffff"/>

  <text x="20" y="30" font-size="18" font-weight="bold" fill="#1f2937">Data Diagram - CI Failure Triage Bot</text>

  <!-- ================= repository_config table ================= -->
  <rect x="50" y="110" width="280" height="250" rx="4" fill="#eaf1fb" stroke="#2f5fa8" stroke-width="1.5"/>
  <rect x="50" y="110" width="280" height="32" rx="4" fill="#2f5fa8"/>
  <rect x="50" y="130" width="280" height="12" fill="#2f5fa8"/>
  <text x="190" y="131" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">repository_config</text>

  <text x="66" y="164" font-size="12.5" font-family="Consolas, monospace" fill="#111827">PK  id : integer</text>
  <line x1="58" y1="172" x2="322" y2="172" stroke="#2f5fa8" stroke-width="0.5"/>
  <text x="66" y="192" font-size="12.5" font-family="Consolas, monospace" fill="#111827">owner : text NOT NULL</text>
  <text x="66" y="212" font-size="12.5" font-family="Consolas, monospace" fill="#111827">name : text NOT NULL</text>
  <text x="66" y="232" font-size="12.5" font-family="Consolas, monospace" fill="#111827">webhook_secret_ref : text</text>
  <text x="66" y="252" font-size="12.5" font-family="Consolas, monospace" fill="#111827">is_active : boolean</text>
  <text x="66" y="272" font-size="12.5" font-family="Consolas, monospace" fill="#111827">created_at : timestamptz</text>

  <line x1="58" y1="284" x2="322" y2="284" stroke="#2f5fa8" stroke-width="0.5"/>
  <text x="66" y="304" font-size="11" font-style="italic" fill="#3b5bdb">UNIQUE(owner, name)</text>
  <text x="66" y="322" font-size="11" font-style="italic" fill="#3b5bdb">= RepoManager 1 manages * RepositoryConfig</text>
  <text x="66" y="340" font-size="11" fill="#3b5bdb">(see 3.2 relationship summary)</text>

  <!-- ================= triage_result table ================= -->
  <rect x="590" y="60" width="330" height="380" rx="4" fill="#f2ecfb" stroke="#6a3fb0" stroke-width="1.5"/>
  <rect x="590" y="60" width="330" height="32" rx="4" fill="#6a3fb0"/>
  <rect x="590" y="80" width="330" height="12" fill="#6a3fb0"/>
  <text x="755" y="81" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">triage_result</text>

  <text x="606" y="114" font-size="12.5" font-family="Consolas, monospace" fill="#111827">PK  id : integer</text>
  <text x="606" y="134" font-size="12.5" font-family="Consolas, monospace" fill="#111827">FK  repository_id : integer</text>
  <line x1="598" y1="144" x2="912" y2="144" stroke="#6a3fb0" stroke-width="0.5"/>
  <text x="606" y="164" font-size="12.5" font-family="Consolas, monospace" fill="#111827">run_id : integer NOT NULL</text>
  <text x="606" y="184" font-size="12.5" font-family="Consolas, monospace" fill="#111827">pr_number : integer NULL</text>
  <text x="606" y="204" font-size="12.5" font-family="Consolas, monospace" font-weight="bold" fill="#111827">failure_category : text NOT NULL</text>
  <text x="606" y="224" font-size="12.5" font-family="Consolas, monospace" font-weight="bold" fill="#111827">confidence_score : real NOT NULL</text>
  <text x="606" y="244" font-size="12.5" font-family="Consolas, monospace" fill="#111827">root_cause : text NOT NULL</text>
  <text x="606" y="264" font-size="12.5" font-family="Consolas, monospace" fill="#111827">suggested_fix : text NOT NULL</text>
  <text x="606" y="284" font-size="12.5" font-family="Consolas, monospace" fill="#111827">comment_status : text</text>
  <text x="606" y="304" font-size="12.5" font-family="Consolas, monospace" fill="#111827">github_comment_url : text NULL</text>
  <text x="606" y="324" font-size="12.5" font-family="Consolas, monospace" fill="#111827">created_at : timestamptz</text>

  <line x1="598" y1="336" x2="912" y2="336" stroke="#6a3fb0" stroke-width="0.5"/>
  <text x="606" y="356" font-size="11" font-style="italic" fill="#6a3fb0">CHECK confidence_score BETWEEN 0 AND 1</text>
  <text x="606" y="374" font-size="11" font-style="italic" fill="#6a3fb0">CHECK comment_status IN ('pending','posted','failed')</text>
  <text x="606" y="396" font-size="11" fill="#6a3fb0">= HistoryStore 1 stores * TriageResult</text>
  <text x="606" y="414" font-size="11" fill="#6a3fb0">(see 3.2 relationship summary)</text>

  <!-- ================= relationship ================= -->
  <line x1="330" y1="235" x2="588" y2="235" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="228" font-size="12" fill="#374151">1</text>
  <text x="560" y="228" font-size="12" fill="#374151">N</text>
  <text x="400" y="252" font-size="12" font-style="italic" fill="#374151">repository_id</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="20" y="490" font-size="11" fill="#6b7280">Engine: SQLite for development, PostgreSQL-compatible for deployment (section 4.2).</text>
  <text x="20" y="508" font-size="11" fill="#6b7280">failure_category / confidence_score renamed from category / confidence to match PromptBuilder (3.3.7), ResponseValidator (3.3.9) and the GitHub PR Comment schema (5.2.5).</text>
</svg>
