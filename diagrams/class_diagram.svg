<svg viewBox="0 0 1150 950" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1150" height="950" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#1f2937">Class Diagram - CI Failure Triage Bot (17 classes)</text>
  <text x="20" y="50" font-size="11.5" fill="#6b7280">Relationship types: uses = dependency/association | creates = instantiation | stores/manages = aggregation. Cardinality: 1 uses 1 (one-to-one) | 1 stores * (one-to-many). Injected clients are Singleton; DTOs are created per request.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- ================= ROW 1 ================= -->
  <!-- WebhookController -->
  <rect x="30" y="80" width="200" height="130" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="1.3"/>
  <rect x="30" y="80" width="200" height="24" fill="#2f5fa8"/>
  <text x="130" y="97" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">WebhookController</text>
  <text x="40" y="120" font-size="10.5" font-family="Consolas,monospace">- verifier: SignatureVerifier</text>
  <text x="40" y="134" font-size="10.5" font-family="Consolas,monospace">- filter: EventFilter</text>
  <text x="40" y="148" font-size="10.5" font-family="Consolas,monospace">- triage_service: TriageService</text>
  <line x1="34" y1="156" x2="226" y2="156" stroke="#2f5fa8" stroke-width="0.5"/>
  <text x="40" y="172" font-size="10.5" font-family="Consolas,monospace">+ handle_github_webhook()</text>

  <!-- DashboardController -->
  <rect x="250" y="80" width="200" height="130" fill="#dbe8fb" stroke="#2f5fa8" stroke-width="1.3"/>
  <rect x="250" y="80" width="200" height="24" fill="#2f5fa8"/>
  <text x="350" y="97" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">DashboardController</text>
  <text x="260" y="120" font-size="10.5" font-family="Consolas,monospace">- history: HistoryStore</text>
  <text x="260" y="134" font-size="10.5" font-family="Consolas,monospace">- triage: TriageService</text>
  <line x1="254" y1="146" x2="446" y2="146" stroke="#2f5fa8" stroke-width="0.5"/>
  <text x="260" y="162" font-size="10.5" font-family="Consolas,monospace">+ list_runs()</text>
  <text x="260" y="176" font-size="10.5" font-family="Consolas,monospace">+ get_detail()</text>

  <!-- SignatureVerifier -->
  <rect x="470" y="80" width="200" height="110" fill="#dcf3e2" stroke="#1f9d55" stroke-width="1.3"/>
  <rect x="470" y="80" width="200" height="24" fill="#1f9d55"/>
  <text x="570" y="97" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">SignatureVerifier</text>
  <text x="480" y="120" font-size="10.5" font-family="Consolas,monospace">- shared_secret: str</text>
  <line x1="474" y1="130" x2="666" y2="130" stroke="#1f9d55" stroke-width="0.5"/>
  <text x="480" y="146" font-size="10.5" font-family="Consolas,monospace">+ verify()</text>

  <!-- EventFilter -->
  <rect x="690" y="80" width="200" height="130" fill="#dcf3e2" stroke="#1f9d55" stroke-width="1.3"/>
  <rect x="690" y="80" width="200" height="24" fill="#1f9d55"/>
  <text x="790" y="97" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">EventFilter</text>
  <text x="700" y="120" font-size="10.5" font-family="Consolas,monospace">- target_event: str</text>
  <text x="700" y="134" font-size="10.5" font-family="Consolas,monospace">- target_status: str</text>
  <text x="700" y="148" font-size="10.5" font-family="Consolas,monospace">- target_conclusion: str</text>
  <line x1="694" y1="156" x2="886" y2="156" stroke="#1f9d55" stroke-width="0.5"/>
  <text x="700" y="172" font-size="10.5" font-family="Consolas,monospace">+ is_valid_failure_event()</text>

  <!-- ConfigManager -->
  <rect x="910" y="80" width="200" height="110" fill="#fdf3d6" stroke="#c9971f" stroke-width="1.3"/>
  <rect x="910" y="80" width="200" height="24" fill="#c9971f"/>
  <text x="1010" y="97" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">ConfigManager</text>
  <text x="920" y="120" font-size="10.5" font-family="Consolas,monospace">- settings: dict</text>
  <line x1="914" y1="130" x2="1106" y2="130" stroke="#c9971f" stroke-width="0.5"/>
  <text x="920" y="146" font-size="10.5" font-family="Consolas,monospace">+ get(key)</text>
  <text x="920" y="160" font-size="10.5" font-family="Consolas,monospace">+ save()</text>

  <!-- ================= ROW 2 ================= -->
  <!-- TriageService -->
  <rect x="30" y="260" width="200" height="190" fill="#fbdede" stroke="#b5322f" stroke-width="1.3"/>
  <rect x="30" y="260" width="200" height="24" fill="#b5322f"/>
  <text x="130" y="277" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">TriageService</text>
  <text x="40" y="300" font-size="10.5" font-family="Consolas,monospace">- github: GitHubClient</text>
  <text x="40" y="314" font-size="10.5" font-family="Consolas,monospace">- claude: ClaudeClient</text>
  <text x="40" y="328" font-size="10.5" font-family="Consolas,monospace">- trimmer: LogTrimmer</text>
  <text x="40" y="342" font-size="10.5" font-family="Consolas,monospace">- prompt_builder: PromptBuilder</text>
  <text x="40" y="356" font-size="10.5" font-family="Consolas,monospace">- validator: ResponseValidator</text>
  <text x="40" y="370" font-size="10.5" font-family="Consolas,monospace">- formatter: MarkdownFormatter</text>
  <line x1="34" y1="378" x2="226" y2="378" stroke="#b5322f" stroke-width="0.5"/>
  <text x="40" y="394" font-size="10.5" font-family="Consolas,monospace">+ process_failed_run()</text>
  <text x="40" y="408" font-size="10.5" font-family="Consolas,monospace">+ fetch_and_trim_logs()</text>
  <text x="40" y="422" font-size="10.5" font-family="Consolas,monospace">+ analyze_with_llm()</text>
  <text x="40" y="436" font-size="10.5" font-family="Consolas,monospace">+ post_comment()</text>

  <!-- GitHubClient -->
  <rect x="250" y="260" width="200" height="150" fill="#ecdcf7" stroke="#6a3fb0" stroke-width="1.3"/>
  <rect x="250" y="260" width="200" height="24" fill="#6a3fb0"/>
  <text x="350" y="277" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">GitHubClient</text>
  <text x="260" y="300" font-size="10.5" font-family="Consolas,monospace">- token: str</text>
  <text x="260" y="314" font-size="10.5" font-family="Consolas,monospace">- base_url: str</text>
  <text x="260" y="328" font-size="10.5" font-family="Consolas,monospace">- session</text>
  <line x1="254" y1="336" x2="446" y2="336" stroke="#6a3fb0" stroke-width="0.5"/>
  <text x="260" y="352" font-size="10.5" font-family="Consolas,monospace">+ get_workflow_logs()</text>
  <text x="260" y="366" font-size="10.5" font-family="Consolas,monospace">+ get_run_details()</text>
  <text x="260" y="380" font-size="10.5" font-family="Consolas,monospace">+ post_pr_comment()</text>

  <!-- ClaudeClient -->
  <rect x="470" y="260" width="200" height="130" fill="#ecdcf7" stroke="#6a3fb0" stroke-width="1.3"/>
  <rect x="470" y="260" width="200" height="24" fill="#6a3fb0"/>
  <text x="570" y="277" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">ClaudeClient</text>
  <text x="480" y="300" font-size="10.5" font-family="Consolas,monospace">- api_key: str</text>
  <text x="480" y="314" font-size="10.5" font-family="Consolas,monospace">- model: str</text>
  <text x="480" y="328" font-size="10.5" font-family="Consolas,monospace">- max_tokens: int</text>
  <line x1="474" y1="336" x2="666" y2="336" stroke="#6a3fb0" stroke-width="0.5"/>
  <text x="480" y="352" font-size="10.5" font-family="Consolas,monospace">+ complete()</text>

  <!-- LogTrimmer -->
  <rect x="690" y="260" width="200" height="130" fill="#d4eeee" stroke="#1f8a8a" stroke-width="1.3"/>
  <rect x="690" y="260" width="200" height="24" fill="#1f8a8a"/>
  <text x="790" y="277" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">LogTrimmer</text>
  <text x="700" y="300" font-size="10.5" font-family="Consolas,monospace">- max_tokens: int</text>
  <text x="700" y="314" font-size="10.5" font-family="Consolas,monospace">- error_patterns: list</text>
  <line x1="694" y1="322" x2="886" y2="322" stroke="#1f8a8a" stroke-width="0.5"/>
  <text x="700" y="338" font-size="10.5" font-family="Consolas,monospace">+ trim()</text>
  <text x="700" y="352" font-size="10.5" font-family="Consolas,monospace">+ extract_errors()</text>

  <!-- PromptBuilder -->
  <rect x="910" y="260" width="200" height="130" fill="#d4eeee" stroke="#1f8a8a" stroke-width="1.3"/>
  <rect x="910" y="260" width="200" height="24" fill="#1f8a8a"/>
  <text x="1010" y="277" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">PromptBuilder</text>
  <text x="920" y="300" font-size="10.5" font-family="Consolas,monospace">- schema: dict</text>
  <text x="920" y="314" font-size="10.5" font-family="Consolas,monospace">- system_prompt: str</text>
  <line x1="914" y1="322" x2="1106" y2="322" stroke="#1f8a8a" stroke-width="0.5"/>
  <text x="920" y="338" font-size="10.5" font-family="Consolas,monospace">+ build()</text>

  <!-- ================= ROW 3 ================= -->
  <!-- ResponseValidator -->
  <rect x="30" y="480" width="200" height="110" fill="#fde6cc" stroke="#c96a1f" stroke-width="1.3"/>
  <rect x="30" y="480" width="200" height="24" fill="#c96a1f"/>
  <text x="130" y="497" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">ResponseValidator</text>
  <text x="40" y="520" font-size="10.5" font-family="Consolas,monospace">- schema: dict</text>
  <text x="40" y="534" font-size="10.5" font-family="Consolas,monospace">- strict: bool</text>
  <line x1="34" y1="542" x2="226" y2="542" stroke="#c96a1f" stroke-width="0.5"/>
  <text x="40" y="558" font-size="10.5" font-family="Consolas,monospace">+ validate()</text>

  <!-- MarkdownFormatter -->
  <rect x="250" y="480" width="200" height="90" fill="#fde6cc" stroke="#c96a1f" stroke-width="1.3"/>
  <rect x="250" y="480" width="200" height="24" fill="#c96a1f"/>
  <text x="350" y="497" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">MarkdownFormatter</text>
  <text x="260" y="520" font-size="10.5" font-family="Consolas,monospace">- template: str</text>
  <line x1="254" y1="528" x2="446" y2="528" stroke="#c96a1f" stroke-width="0.5"/>
  <text x="260" y="544" font-size="10.5" font-family="Consolas,monospace">+ format()</text>

  <!-- HistoryStore -->
  <rect x="470" y="480" width="200" height="110" fill="#fdf3d6" stroke="#c9971f" stroke-width="1.3"/>
  <rect x="470" y="480" width="200" height="24" fill="#c9971f"/>
  <text x="570" y="497" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">HistoryStore</text>
  <text x="480" y="520" font-size="10.5" font-family="Consolas,monospace">- rows: list</text>
  <line x1="474" y1="528" x2="666" y2="528" stroke="#c9971f" stroke-width="0.5"/>
  <text x="480" y="544" font-size="10.5" font-family="Consolas,monospace">+ save(result) / find(run_id)</text>
  <text x="480" y="558" font-size="10.5" font-family="Consolas,monospace">+ list_recent()</text>

  <!-- RepoManager -->
  <rect x="690" y="480" width="200" height="110" fill="#fdf3d6" stroke="#c9971f" stroke-width="1.3"/>
  <rect x="690" y="480" width="200" height="24" fill="#c9971f"/>
  <text x="790" y="497" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">RepoManager</text>
  <text x="700" y="520" font-size="10.5" font-family="Consolas,monospace">- repos: list</text>
  <line x1="694" y1="528" x2="886" y2="528" stroke="#c9971f" stroke-width="0.5"/>
  <text x="700" y="544" font-size="10.5" font-family="Consolas,monospace">+ add_config() / find_by_repo()</text>
  <text x="700" y="558" font-size="10.5" font-family="Consolas,monospace">+ list_all()</text>

  <!-- ================= ROW 4 : DTOs ================= -->
  <!-- TriageResult -->
  <rect x="30" y="640" width="420" height="270" fill="#eceff1" stroke="#5b6b73" stroke-width="1.3"/>
  <rect x="30" y="640" width="420" height="26" fill="#5b6b73"/>
  <text x="240" y="658" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">TriageResult (DTO)</text>
  <text x="40" y="682" font-size="11" font-family="Consolas,monospace">- id: int [PK]</text>
  <text x="40" y="698" font-size="11" font-family="Consolas,monospace">- repository_id: int [FK]</text>
  <text x="40" y="714" font-size="11" font-family="Consolas,monospace">- run_id: int</text>
  <text x="40" y="730" font-size="11" font-family="Consolas,monospace">- pr_number: int | None</text>
  <text x="40" y="746" font-size="11" font-family="Consolas,monospace">- failure_category: str</text>
  <text x="40" y="762" font-size="11" font-family="Consolas,monospace">- confidence_score: float</text>
  <text x="40" y="778" font-size="11" font-family="Consolas,monospace">- root_cause: str</text>
  <text x="40" y="794" font-size="11" font-family="Consolas,monospace">- suggested_fix: str</text>
  <text x="40" y="810" font-size="11" font-family="Consolas,monospace">- comment_status: str</text>
  <text x="40" y="826" font-size="11" font-family="Consolas,monospace">- github_comment_url: str | None</text>
  <text x="40" y="842" font-size="11" font-family="Consolas,monospace">- created_at: datetime</text>
  <line x1="34" y1="850" x2="446" y2="850" stroke="#5b6b73" stroke-width="0.5"/>
  <text x="40" y="866" font-size="11" font-family="Consolas,monospace">+ from_dict() / + to_dict()</text>

  <!-- WebhookPayload -->
  <rect x="470" y="640" width="200" height="130" fill="#eceff1" stroke="#5b6b73" stroke-width="1.3"/>
  <rect x="470" y="640" width="200" height="24" fill="#5b6b73"/>
  <text x="570" y="657" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">WebhookPayload (DTO)</text>
  <text x="480" y="680" font-size="10.5" font-family="Consolas,monospace">- event: str</text>
  <text x="480" y="694" font-size="10.5" font-family="Consolas,monospace">- status: str</text>
  <text x="480" y="708" font-size="10.5" font-family="Consolas,monospace">- run_id: int</text>
  <text x="480" y="722" font-size="10.5" font-family="Consolas,monospace">- repo: str</text>
  <line x1="474" y1="730" x2="666" y2="730" stroke="#5b6b73" stroke-width="0.5"/>
  <text x="480" y="746" font-size="10.5" font-family="Consolas,monospace">+ from_dict()</text>

  <!-- RepositoryConfig -->
  <rect x="690" y="640" width="220" height="150" fill="#eceff1" stroke="#5b6b73" stroke-width="1.3"/>
  <rect x="690" y="640" width="220" height="24" fill="#5b6b73"/>
  <text x="800" y="657" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">RepositoryConfig (DTO)</text>
  <text x="700" y="680" font-size="10.5" font-family="Consolas,monospace">- id: int [PK]</text>
  <text x="700" y="694" font-size="10.5" font-family="Consolas,monospace">- owner: str</text>
  <text x="700" y="708" font-size="10.5" font-family="Consolas,monospace">- name: str</text>
  <text x="700" y="722" font-size="10.5" font-family="Consolas,monospace">- webhook_secret_ref: str</text>
  <text x="700" y="736" font-size="10.5" font-family="Consolas,monospace">- is_active: bool</text>
  <text x="700" y="750" font-size="10.5" font-family="Consolas,monospace">- created_at: datetime</text>
  <line x1="694" y1="758" x2="906" y2="758" stroke="#5b6b73" stroke-width="0.5"/>
  <text x="700" y="774" font-size="10.5" font-family="Consolas,monospace">+ validate()</text>

  <!-- ================= RELATIONSHIPS ================= -->
  <line x1="230" y1="130" x2="470" y2="120" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="300" y="118" font-size="9.5" fill="#374151">1 uses 1</text>

  <line x1="230" y1="150" x2="690" y2="150" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="420" y="145" font-size="9.5" fill="#374151">1 uses 1</text>

  <line x1="120" y1="210" x2="120" y2="260" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="128" y="238" font-size="9.5" fill="#374151">1 uses 1</text>

  <line x1="260" y1="210" x2="150" y2="260" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>

  <path d="M 400 210 C 480 320, 570 380, 570 480" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="470" y="330" font-size="9.5" fill="#374151">1 uses 1</text>

  <line x1="230" y1="300" x2="250" y2="300" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="230" y1="330" x2="470" y2="300" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="230" y1="345" x2="690" y2="310" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="230" y1="360" x2="910" y2="310" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="255" y="290" font-size="9.5" fill="#374151">1 uses 1 (x6)</text>

  <line x1="130" y1="450" x2="130" y2="480" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="180" y1="450" x2="330" y2="480" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>

  <line x1="130" y1="590" x2="150" y2="640" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="140" y="620" font-size="9.5" fill="#374151">1 creates 1</text>

  <line x1="330" y1="570" x2="280" y2="640" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="300" y="610" font-size="9.5" fill="#374151">1 uses 1</text>

  <path d="M 560 590 C 500 620, 450 630, 400 640" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="470" y="615" font-size="9.5" fill="#374151">1 stores *</text>

  <line x1="790" y1="590" x2="800" y2="640" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="805" y="618" font-size="9.5" fill="#374151">1 manages *</text>

  <path d="M 130 80 L 130 65 L 1140 65 L 1140 800 L 570 800 L 570 770" fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="760" y="795" font-size="9.5" fill="#374151">1 creates 1 (WebhookController &#8594; WebhookPayload)</text>

  <!-- ================= legend ================= -->
  <text x="20" y="925" font-size="11" fill="#374151">Legend: Blue=Controller  Green=Filter/Verifier  Red=Orchestrator  Purple=API Client  Teal=Processing  Orange=Format/Validate  Yellow=Config/Store  Grey=DTO</text>
  <text x="20" y="940" font-size="11" fill="#374151">Cardinality notation: 1 uses 1 (one-to-one) | 1 stores * (one-to-many). All injected clients are Singleton lifetime.</text>
</svg>
